name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          Write-Host "ninja: $((Get-Command ninja.exe -ErrorAction SilentlyContinue).Source)"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          Write-Host "vswhere exists: $(Test-Path $vswhere)"
          if (Test-Path $vswhere) {
            Write-Host "VS path: $(& $vswhere -latest -products * -property installationPath)"
            Write-Host "VS version: $(& $vswhere -latest -products * -property catalog_productDisplayVersion)"
          }

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere not found (no Visual Studio on this runner)' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation with C++ tools found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          Write-Host "using Visual Studio: $vs"
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Set-Item -Path "Env:$($matches[1])" -Value $matches[2]
              if ($env:GITHUB_ENV) { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }
          Write-Host "cl.exe : $((Get-Command cl.exe -ErrorAction SilentlyContinue).Source)"
          Write-Host "ninja  : $((Get-Command ninja.exe -ErrorAction SilentlyContinue).Source)"

      - name: Clone vcpkg
        shell: pwsh
        run: git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Clone CommonLibSSE-NG
        shell: pwsh
        run: git clone --branch ng --depth 1 https://github.com/alandtse/CommonLibSSE-NG.git extern/CommonLibSSE-NG

      - name: Install dependencies (first run takes 10-25 minutes)
        shell: pwsh
        run: .\vcpkg\vcpkg.exe install fmt spdlog rapidcsv xbyak directxmath directxtk --triplet x64-windows-static-md

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:GITHUB_WORKSPACE 'vcpkg\scripts\buildsystems\vcpkg.cmake'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md" -DBUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\SKSE\Plugins | Out-Null
          $dll = Get-ChildItem -Path build -Recurse -Filter NoMenuCloseDodge.dll | Select-Object -First 1
          if (-not $dll) { throw 'NoMenuCloseDodge.dll not found' }
          Copy-Item $dll.FullName out\SKSE\Plugins\NoMenuCloseDodge.dll
          if (Test-Path NoMenuCloseDodge.ini) { Copy-Item NoMenuCloseDodge.ini out\SKSE\Plugins\NoMenuCloseDodge.ini }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NoMenuCloseDodge-MOD
          path: out
