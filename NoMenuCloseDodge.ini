; NoMenuCloseDodge —— 可选设置文件
; 放在： Data\SKSE\Plugins\NoMenuCloseDodge.ini
; （放进 MO2 的 NoMenuCloseDodge-MOD\SKSE\Plugins\ 里即可，也可以直接放在游戏 Data 下）
; 没有这个文件时，插件使用默认值 300 毫秒，功能完全正常。

[Main]
; 菜单关闭后，屏蔽“移动输入”的时长（毫秒）。
; 目的：让 TK Dodge RE 的 canDodge() 里的 IsMovementControlsEnabled() 为 false，
;       从而不会把“用手柄 B 关菜单”的那一次按键误判成闪避。
; 默认 300（与下架的原版 MOD 一致，约 0.30 秒）。范围 50 ~ 5000。
; 如果觉得关完菜单之后 0.3 秒内不能移动有点别扭，可以调小，例如 150~200 通常也够。
BlockDurationMs = 300
